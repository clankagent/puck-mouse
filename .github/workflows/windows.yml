name: Windows
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Verify and package
        run: ./gradlew.bat --no-daemon --console=plain test createDistributable packageMsi packageExe
      - name: Verify packaged runtime and DLL
        shell: pwsh
        run: |
          $result=Join-Path $env:RUNNER_TEMP 'packaged-self-test.txt'
          $app=Resolve-Path 'build/compose/binaries/main/app/PuckMouse/PuckMouse.exe'
          $p=Start-Process -FilePath $app -ArgumentList '--self-test',$result -Wait -PassThru
          if($p.ExitCode -ne 0 -or !(Test-Path $result)) { throw 'Packaged self-test failed' }
          Get-Content $result
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: puck-mouse-windows-x64
          path: |
            build/compose/binaries/main/msi/*.msi
            build/compose/binaries/main/exe/*.exe
            build/reports/tests/test/**
